<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="sans-serif">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#d6e0ea" stroke-width="1"/>
    </pattern>
    <pattern id="grid5" width="150" height="150" patternUnits="userSpaceOnUse">
      <path d="M150 0H0V150" fill="none" stroke="#bfcddc" stroke-width="1.2"/>
    </pattern>
    <!-- 가상 플레이어 한 줄 -->
    <g id="row">
      <circle cx="0" cy="0" r="11"/><circle cx="40" cy="0" r="11"/><circle cx="80" cy="0" r="11"/><circle cx="120" cy="0" r="11"/>
      <circle cx="160" cy="0" r="11"/><circle cx="200" cy="0" r="11"/><circle cx="240" cy="0" r="11"/><circle cx="280" cy="0" r="11"/>
      <circle cx="320" cy="0" r="11"/><circle cx="360" cy="0" r="11"/><circle cx="400" cy="0" r="11"/><circle cx="440" cy="0" r="11"/>
      <circle cx="480" cy="0" r="11"/><circle cx="520" cy="0" r="11"/><circle cx="560" cy="0" r="11"/><circle cx="600" cy="0" r="11"/>
      <circle cx="640" cy="0" r="11"/><circle cx="680" cy="0" r="11"/><circle cx="720" cy="0" r="11"/><circle cx="760" cy="0" r="11"/>
      <circle cx="800" cy="0" r="11"/><circle cx="840" cy="0" r="11"/><circle cx="880" cy="0" r="11"/><circle cx="920" cy="0" r="11"/>
    </g>
  </defs>
  <rect width="1200" height="630" fill="#f3f6f9"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#grid5)"/>
  <line x1="96" y1="0" x2="96" y2="630" stroke="#ec9a9a" stroke-width="3"/>
  <g fill="#2f6fdc" stroke="#1f2a44" stroke-width="2">
    <use href="#row" x="160" y="80"/>
    <use href="#row" x="180" y="120" opacity="0.8"/>
    <use href="#row" x="160" y="160" opacity="0.6"/>
    <use href="#row" x="180" y="200" opacity="0.4"/>
  </g>
  <!-- 멈춘 진행 막대: 115개 중 70개 -->
  <rect x="200" y="500" width="800" height="40" rx="20" fill="#fff" stroke="#1f2a44" stroke-width="3"/>
  <rect x="204" y="504" width="483" height="32" rx="16" fill="#9fb3c8"/>
  <text x="1020" y="530" font-size="28" font-weight="700" fill="#1f2a44">70 / 115</text>
  <g fill="#e2603f">
    <rect x="690" y="470" width="14" height="40" rx="3"/>
    <rect x="712" y="470" width="14" height="40" rx="3"/>
  </g>
</svg>
