<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="sans-serif">
  <rect width="960" height="470" rx="12" fill="#f3f6f9"/>
  <text x="40" y="50" font-size="22" font-weight="700" fill="#1f2a44">하루에 세 번 돌린 탐색</text>
  <text x="40" y="78" font-size="15" fill="#4a5875">막대 길이는 걸린 시간 (114분 = 막대 전체)</text>

  <!-- 1차: 65분 -->
  <text x="40" y="133" font-size="20" font-weight="700" fill="#1f2a44">1차</text>
  <rect x="100" y="110" width="296" height="34" rx="6" fill="#9fb3c8"/>
  <text x="112" y="133" font-size="16" fill="#1f2a44">151개 설정, 65분</text>
  <text x="560" y="133" font-size="17" fill="#1f2a44">결론: 버림 둘, 보류 셋</text>
  <text x="100" y="170" font-size="15" fill="#e2603f">잠깐, 모델과 지표가 엉뚱한 걸 쟀다 (실수 둘). 이 판정은 무효</text>

  <!-- 2차: 114분 -->
  <text x="40" y="243" font-size="20" font-weight="700" fill="#1f2a44">2차</text>
  <rect x="100" y="220" width="520" height="34" rx="6" fill="#9fb3c8"/>
  <text x="112" y="243" font-size="16" fill="#1f2a44">136개 설정, 114분</text>
  <text x="640" y="243" font-size="17" fill="#1f2a44">결론: 다섯 모두 보류</text>
  <text x="100" y="280" font-size="15" fill="#e2603f">잠깐, 지표 둘이 묻는 걸 못 쟀다 (또 실수 둘)</text>

  <!-- 3차: 약 33분, 중단 -->
  <text x="40" y="353" font-size="20" font-weight="700" fill="#1f2a44">3차</text>
  <rect x="100" y="330" width="151" height="34" rx="6" fill="#9fb3c8"/>
  <rect x="251" y="330" width="369" height="34" rx="6" fill="none" stroke="#9fb3c8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="270" y="353" font-size="16" fill="#4a5875">115개 중 70개에서 중단</text>
  <text x="640" y="353" font-size="17" fill="#1f2a44">"현실적으로 무리"</text>

  <!-- 보류 도장 -->
  <g transform="translate(850 180) rotate(-12)">
    <rect x="-70" y="-34" width="140" height="68" rx="8" fill="none" stroke="#e2603f" stroke-width="5"/>
    <text x="0" y="16" font-size="40" font-weight="800" fill="#e2603f" text-anchor="middle">보류</text>
  </g>
  <text x="40" y="430" font-size="15" fill="#4a5875">세 번 모두 같은 날. 3차는 코어 11개로 나눠 돌렸는데도 그랬다</text>
</svg>
