<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="sans-serif">
  <rect width="960" height="330" rx="12" fill="#f3f6f9"/>
  <text x="40" y="50" font-size="22" font-weight="700" fill="#1f2a44">핵심 경험 기준 네 가지</text>
  <g stroke="#1f2a44" stroke-width="2" fill="#fff">
    <rect x="40" y="80" width="200" height="210" rx="12"/>
    <rect x="260" y="80" width="200" height="210" rx="12"/>
    <rect x="480" y="80" width="200" height="210" rx="12"/>
    <rect x="700" y="80" width="220" height="210" rx="12"/>
  </g>
  <g font-size="34" font-weight="800" fill="#e2603f">
    <text x="60" y="130">1</text><text x="280" y="130">2</text><text x="500" y="130">3</text><text x="720" y="130">4</text>
  </g>
  <g font-size="19" font-weight="700" fill="#1f2a44">
    <text x="60" y="170">강해진 체감</text>
    <text x="280" y="170">득템의 재미</text>
    <text x="500" y="170">생각하며</text><text x="500" y="194">하는 플레이</text>
    <text x="720" y="170">보이는 변화</text>
  </g>
  <g font-size="14" fill="#4a5875">
    <text x="60" y="210">혼자 해도</text><text x="60" y="230">시원시원하게</text>
    <text x="280" y="210">늘 재료만 줍는 건</text><text x="280" y="230">재미없다</text>
    <text x="500" y="230">옵션을 다시 뽑을까,</text><text x="500" y="250">장비를 바꿀까</text>
    <text x="720" y="210">같은 사각형 맵만</text><text x="720" y="230">돌면 강해진 줄도</text><text x="720" y="250">모른다</text>
  </g>
</svg>
