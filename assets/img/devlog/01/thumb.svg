<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#d6e0ea" stroke-width="1"/>
    </pattern>
    <pattern id="grid5" width="150" height="150" patternUnits="userSpaceOnUse">
      <path d="M150 0H0V150" fill="none" stroke="#bfcddc" stroke-width="1.2"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#f3f6f9"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#grid5)"/>
  <line x1="96" y1="0" x2="96" y2="630" stroke="#ec9a9a" stroke-width="3"/>
  <!-- 빨간 원 16개 = 설계 점검에서 나온 빈틈 16개 -->
  <g fill="#e2603f" stroke="#1f2a44" stroke-width="3">
    <circle cx="420" cy="140" r="18"/><circle cx="560" cy="110" r="18"/><circle cx="720" cy="130" r="18"/><circle cx="860" cy="190" r="18"/>
    <circle cx="930" cy="310" r="18"/><circle cx="880" cy="440" r="18"/><circle cx="760" cy="510" r="18"/><circle cx="610" cy="530" r="18"/>
    <circle cx="460" cy="500" r="18"/><circle cx="340" cy="420" r="18"/><circle cx="300" cy="290" r="18"/><circle cx="330" cy="200" r="18"/>
    <circle cx="1040" cy="230" r="18"/><circle cx="1080" cy="480" r="18"/><circle cx="200" cy="520" r="18"/><circle cx="210" cy="110" r="18"/>
  </g>
  <!-- 가운데 파란 원 = 나 -->
  <circle cx="615" cy="320" r="40" fill="#fff" stroke="#1f2a44" stroke-width="3"/>
  <circle cx="615" cy="320" r="32" fill="#2f6fdc"/>
  <circle cx="603" cy="331" r="7" fill="#fff"/>
</svg>
