<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="monospace">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#d6e0ea" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#f3f6f9"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <line x1="96" y1="0" x2="96" y2="630" stroke="#ec9a9a" stroke-width="3"/>
  <!-- 코드 줄 -->
  <g fill="#c9d5e2">
    <rect x="150" y="70" width="420" height="14" rx="7"/><rect x="190" y="110" width="560" height="14" rx="7"/>
    <rect x="190" y="150" width="300" height="14" rx="7"/><rect x="230" y="190" width="640" height="14" rx="7"/>
    <rect x="230" y="230" width="380" height="14" rx="7"/><rect x="190" y="270" width="500" height="14" rx="7"/>
    <rect x="150" y="310" width="260" height="14" rx="7"/><rect x="150" y="390" width="460" height="14" rx="7"/>
    <rect x="190" y="430" width="700" height="14" rx="7"/><rect x="190" y="470" width="340" height="14" rx="7"/>
    <rect x="150" y="510" width="520" height="14" rx="7"/><rect x="150" y="550" width="300" height="14" rx="7"/>
  </g>
  <!-- 모든 / 가 바뀌어 버린 자리 -->
  <g fill="#e2603f" font-size="46" font-weight="700">
    <text x="600" y="100">/</text><text x="780" y="140">/</text><text x="520" y="180">/</text><text x="900" y="220">/</text>
    <text x="640" y="260">/</text><text x="720" y="300">/</text><text x="440" y="340">/</text><text x="980" y="380">/</text>
    <text x="640" y="420">/</text><text x="920" y="460">/</text><text x="560" y="500">/</text><text x="700" y="540">/</text>
    <text x="1040" y="160">/</text><text x="1080" y="520">/</text><text x="860" y="590">/</text><text x="380" y="600">/</text>
  </g>
  <!-- 막는 손: 빨간 정지 막대 -->
  <rect x="1010" y="250" width="110" height="110" rx="20" fill="#fff" stroke="#1f2a44" stroke-width="4"/>
  <rect x="1032" y="295" width="66" height="20" rx="6" fill="#e2603f"/>
</svg>
